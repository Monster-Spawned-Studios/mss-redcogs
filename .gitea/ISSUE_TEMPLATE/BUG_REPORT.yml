name: Bug Report
about: Report a bug to help us improve
title: "[BUG]: <CHANGE-THIS-TO-BUG-TITLE>"
labels: ["bug", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please provide as much detail as possible to help us resolve the issue.

  - type: input
    id: title
    attributes:
      label: Bug Title
      description: Provide a short and descriptive title for the bug.
      placeholder: "Bug title"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the bug in detail. Include steps to reproduce, expected behavior, and actual behavior.
      placeholder: "Describe the bug here"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Specify the environment where the bug occurred (e.g., OS, browser, version).
      placeholder: "e.g., Windows 10, Chrome 95"
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide a step-by-step guide to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
      placeholder: "Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: Describe what actually happened.
      placeholder: "Actual behavior"
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: |
        Add any other context about the problem here (e.g., logs, screenshots).
        If there's no additional context, leave this section empty or type "N/A".
      placeholder: "Additional context"
    validations:
      required: true
