name: Feature Request
about: Suggest a new feature or enhancement
title: "[Feature Request]: <CHANGE-THIS-TO-FEATURE-TITLE>"
labels: ["enhancement", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please fill out the details below to help us understand your request.
  - type: input
    id: feature-summary
    attributes:
      label: Feature Summary
      description: Provide a brief summary of the feature you are requesting.
      placeholder: "Add a short description of the feature"
    validations:
      required: true
  - type: textarea
    id: feature-details
    attributes:
      label: Feature Details
      description: Explain the feature in detail. Include any relevant context or examples.
      placeholder: "Describe the feature and its use case"
    validations:
      required: true
  - type: input
    id: benefits
    attributes:
      label: Benefits
      description: Explain how this feature will benefit users or improve the project.
      placeholder: "Describe the benefits of this feature"
    validations:
      required: true
  - type: textarea
    id: drawbacks
    attributes:
      label: Drawbacks
      description: |
        Explain the potential drawbacks of this feature, or any potential issues it may cause.
        Please be aware that this section is not a substitute for thorough testing and validation.
        DO NOT USE PHRASES SUCH AS "N/A", "NONE", OR "NO DRAWBACKS"!
        This is meant to help guide you in your decision process, help brainstorm solutions, and
        avoid unnecessary confusion.
      placeholder: "Describe any potential drawbacks"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: List any alternative solutions or features you've considered.
      placeholder: "Describe alternative approaches, if any"
    validations:
      required: false
  - type: input
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request.
      placeholder: "Provide any additional information"
